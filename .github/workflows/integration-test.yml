name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Local Supabase deterministic keys — safe to hardcode for the local test instance only
  SUPABASE_LOCAL_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRFA0NiK7ACcPzu77v7IsO12uRhFXBs-GzFh0cU_zEI
  SUPABASE_LOCAL_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hj04zWl196z2-SBc0
  SUPABASE_LOCAL_URL: http://127.0.0.1:54321

jobs:
  ml-tests:
    name: ML Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r ml/requirements.txt pytest

      - name: Verify or train ML artifacts
        run: |
          echo "=== ml/artifacts/ ==="
          ls -la ml/artifacts/ || echo "Directory not found"
          echo "=== backend/ml/artifacts/ ==="
          ls -la backend/ml/artifacts/ || echo "Directory not found"
          if [ ! -f ml/artifacts/parkinsons_model.h5 ] || \
             [ ! -f ml/artifacts/scaler.joblib ] || \
             [ ! -f ml/artifacts/feature_names.joblib ]; then
            echo "Artifacts missing — training model..."
            mkdir -p ml/artifacts
            cd backend/ml
            python train_model.py
            cp artifacts/*.h5 artifacts/*.joblib ../../ml/artifacts/ 2>/dev/null || true
          else
            echo "All ML artifacts present."
          fi

      - name: Run ML unit tests
        run: |
          mkdir -p test-results
          pytest tests/ml/test_ml_unit.py -v --junit-xml=test-results/ml-results.xml

      - name: Upload ML test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-test-results
          path: test-results/ml-results.xml

  backend-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        working-directory: backend
        # --ignore-health-check avoids failures when optional services (e.g.
        # logflare, vector) are slow to start on cold GH-hosted runners.
        run: supabase start --ignore-health-check

      - name: Create Edge Functions env file
        working-directory: backend
        run: |
          cat > .env.ci << 'EOF'
          AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE=${{ secrets.AUTH0_AUDIENCE }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
          CI_TEST_USER_SUB=test|ci-user-123
          CI_BYPASS_AUTH=true
          EOF

      - name: Serve Edge Functions
        working-directory: backend
        run: |
          supabase functions serve \
            --env-file .env.ci \
            --no-verify-jwt &

      - name: Wait for Edge Functions
        run: |
          echo "Waiting for Edge Functions to become ready..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ci-dummy-token" \
              -H "Content-Type: application/json" \
              -d '{}' \
              http://127.0.0.1:54321/functions/v1/create-session 2>/dev/null || echo "000")
            if echo "$STATUS" | grep -qE "^(200|201|400|404|422)$"; then
              echo "Functions ready (HTTP $STATUS)"
              break
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 3s..."
            sleep 3
          done

      - name: Run backend integration tests
        env:
          SUPABASE_URL: ${{ env.SUPABASE_LOCAL_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_LOCAL_ANON_KEY }}
          CI_TOKEN: ci-dummy-token
        run: |
          mkdir -p test-results
          bash tests/backend/run_integration_tests.sh

      - name: Upload backend test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results/backend-results.json

  e2e-tests:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install all dependencies
        run: npm run install:all

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Create frontend env file
        working-directory: frontend
        run: |
          cat > .env << 'EOF'
          VITE_AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID }}
          VITE_SUPABASE_URL=${{ env.SUPABASE_LOCAL_URL }}
          VITE_SUPABASE_ANON_KEY=${{ env.SUPABASE_LOCAL_ANON_KEY }}
          EOF

      - name: Start Vite dev server
        working-directory: frontend
        run: npm run dev &

      - name: Wait for Vite dev server
        run: |
          echo "Waiting for Vite dev server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Dev server ready on port 5173"
              break
            fi
            echo "Attempt $i — retrying in 2s..."
            sleep 2
          done

      - name: Run Playwright tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          CI: "true"
        run: |
          mkdir -p ../test-results
          npx playwright test

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload E2E JUnit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/e2e-results.xml

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: frontend/test-results/
